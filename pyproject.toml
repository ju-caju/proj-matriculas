[project]
name = "turmas-ufpb"
version = "0.1.0"
description = "Consulta de turmas de graduação da UFPB"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography==41.0.7",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6,<8",
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["api", "backend", "server.py"]
check_untyped_defs = true
explicit_package_bases = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["api", "backend"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]
