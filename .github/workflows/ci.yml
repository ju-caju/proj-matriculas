name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: uv sync --locked

      - name: Audit locked dependencies
        run: make audit

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: make format-check

      - name: Run lint
        run: make lint

      - name: Check types
        run: make typecheck

      - name: Run tests
        run: make test

      - name: Start local server for smoke test
        run: |
          uv run uvicorn server:app --host 127.0.0.1 --port 8765 > /tmp/matriculas-server.log 2>&1 &
          echo $! > /tmp/matriculas-server.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/matriculas-server.log
          exit 1

      - name: Run local smoke test
        run: make smoke-test

      - name: Stop local server
        if: ${{ always() }}
        run: test ! -f /tmp/matriculas-server.pid || kill "$(cat /tmp/matriculas-server.pid)"

      - name: Measure Python coverage
        run: make coverage
